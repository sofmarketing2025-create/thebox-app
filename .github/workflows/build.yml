name: Gerar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSAO_BASE: "2.1"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura, o AltStore assina)
        run: |
          xcodebuild -project TheBox.xcodeproj -scheme TheBox \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation             MARKETING_VERSION="$VERSAO_BASE.${{ github.run_number }}"             CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -80; tail -30 build.log; exit 1; }

      - name: Empacotar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TheBox.app Payload/
          zip -qry LBO-Financas.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LBO-Financas-ipa
          path: LBO-Financas.ipa

      - name: Publicar versão e atualizar a fonte do AltStore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$VERSAO_BASE.${{ github.run_number }}"
          TAG="v$VER"
          NOTAS=$(git log -1 --pretty=%s)
          python3 scripts/fonte_altstore.py "$VER" "${{ github.run_number }}" "$TAG" "$(stat -f%z LBO-Financas.ipa)" "$NOTAS" > altstore.json
          gh release create "$TAG" LBO-Financas.ipa altstore.json --title "LBO Finanças $VER" --notes "$NOTAS" --latest
